<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drum Kit</title>
  <meta name="description" content="A zero-latency drum kit in the browser: play the pads, record loops, share beats as links, and take the rhythm challenge.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/arcade-shell.css">
</head>
<body>
  <!-- Arcade.init wraps this canvas in the stage; it stays hidden (the inline style beats the shell's display:block). -->
  <canvas id="gameCanvas" width="800" height="600" style="display:none"></canvas>

  <div id="drums" class="drums">
    <div class="splash-layer" id="splashLayer" aria-hidden="true"></div>
    <div class="pads" id="pads" role="group" aria-label="Drum pads"></div>
  </div>

  <script src="js/arcade-shell.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
